# The browser calls the APIs from the app's origin (login, uploads), so every
# API answers CORS here, in one place, instead of each service doing its own.
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Access-Control-Max-Age 3600 always;
    return 204;
}

proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Expose-Headers;
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Expose-Headers "Content-Range, Content-Location, X-Total-Count, X-Supabase-Api-Version, Location" always;
